services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examquestion}
      POSTGRES_USER: ${POSTGRES_USER:-webuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_v16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webuser}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-examquestion}
      MEDIA_ROOT: /data/media
      LIVE_FETCH_ENABLED: ${LIVE_FETCH_ENABLED:-false}
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webuser}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-examquestion}
      MEDIA_ROOT: /data/media
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      LIVE_FETCH_ENABLED: ${LIVE_FETCH_ENABLED:-false}
    volumes:
      - media_data:/data/media
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    profiles: ["scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webuser}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-examquestion}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-86400}
      LIVE_FETCH_ENABLED: ${LIVE_FETCH_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data_v16:
  media_data:
