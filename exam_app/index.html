<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Past Questions</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-3xl px-4 py-6">
    <h1 class="text-2xl font-semibold">Past Questions</h1>

    <form id="filters" class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
      <label class="text-sm">Exam
        <select id="exam" class="mt-1 w-full rounded border border-slate-300 bg-white p-2"></select></label>
      <label class="text-sm">Subject
        <select id="subject" class="mt-1 w-full rounded border border-slate-300 bg-white p-2"></select></label>
      <label class="text-sm">Year
        <select id="year" class="mt-1 w-full rounded border border-slate-300 bg-white p-2"></select></label>
      <label class="text-sm sm:col-span-3">Search
        <span class="mt-1 flex gap-2">
          <input id="q" type="search" maxlength="100" placeholder="e.g. photosynthesis"
                 class="w-full rounded border border-slate-300 bg-white p-2">
          <button class="rounded bg-slate-900 px-4 text-white hover:bg-slate-700">Search</button>
        </span></label>
    </form>

    <p id="status" class="mt-4 text-sm text-slate-600" role="status"></p>
    <div id="list" class="mt-2 space-y-4"></div>

    <nav class="mt-6 flex items-center justify-between">
      <button id="prev" type="button" class="rounded border border-slate-300 bg-white px-4 py-2 disabled:opacity-40">Previous</button>
      <button id="next" type="button" class="rounded border border-slate-300 bg-white px-4 py-2 disabled:opacity-40">Next</button>
    </nav>
  </main>

<script>
const PAGE = 20;
let offset = 0, total = 0;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // textContent only: scraped text is never parsed as HTML
  return e;
};
const api = async (path, params = {}) => {
  const u = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params)) if (v !== '' && v != null) u.searchParams.set(k, v);
  const r = await fetch(u);
  if (!r.ok) throw new Error('Request failed (' + r.status + ')');
  return r.json();
};
const fill = (sel, first, rows, label) => {
  sel.replaceChildren(new Option(first, ''));
  rows.forEach((r) => sel.add(new Option(label(r), r.id ?? r)));
};
const render = (node) => window.renderMathInElement && renderMathInElement(node, {
  delimiters: [
    { left: '\\(', right: '\\)', display: false },
    { left: '\\[', right: '\\]', display: true },
    { left: '$$', right: '$$', display: true },
  ],
  throwOnError: false,
});

async function loadSubjects() {
  const id = $('exam').value;
  fill($('subject'), 'All subjects', id ? await api('/api/subjects', { exam_id: id }) : [], (s) => `${s.name} (${s.n})`);
  await loadYears();
}
async function loadYears() {
  const id = $('exam').value;
  fill($('year'), 'All years', id ? await api('/api/years', { exam_id: id, subject_id: $('subject').value }) : [], String);
}

function card(item) {
  const box = el('article', 'rounded-lg border border-slate-200 bg-white p-4 shadow-sm');
  box.append(el('p', 'text-xs text-slate-500', `${item.exam} · ${item.subject} · ${item.year ?? 'year n/a'}`));
  box.append(el('p', 'mt-2 whitespace-pre-wrap', item.question));
  const opts = el('div', 'mt-3 space-y-2');
  let chosen = null;
  const buttons = item.options.map((o) => {
    const b = el('button', 'flex w-full gap-2 rounded border border-slate-200 p-2 text-left hover:bg-slate-50');
    b.type = 'button';
    b.append(el('span', 'font-semibold', o.key + '.'), el('span', 'whitespace-pre-wrap', o.text));
    b.addEventListener('click', () => {
      buttons.forEach((x) => x.el.classList.remove('ring-2', 'ring-slate-900'));
      b.classList.add('ring-2', 'ring-slate-900');
      chosen = o;
    });
    return { el: b, o };
  });
  buttons.forEach((x) => opts.append(x.el));
  const reveal = el('button', 'mt-3 rounded bg-slate-900 px-3 py-1.5 text-sm text-white hover:bg-slate-700', 'Show answer');
  reveal.type = 'button';
  const out = el('div', 'mt-3 text-sm');
  reveal.addEventListener('click', async () => {
    try {
      const a = await api(`/api/questions/${item.id}/answer`);
      const ans = String(a.answer ?? '').trim().toUpperCase();
      const isRight = (o) => o.key === ans || o.text.trim().toUpperCase() === ans;
      buttons.forEach(({ el: b, o }) => {
        if (isRight(o)) b.classList.add('border-green-500', 'bg-green-50');
        else if (chosen === o) b.classList.add('border-red-500', 'bg-red-50');
      });
      out.replaceChildren(el('p', 'font-medium', 'Answer: ' + (a.answer ?? 'not available')));
      if (a.explanation) out.append(el('p', 'mt-1 whitespace-pre-wrap text-slate-700', a.explanation));
      render(out);
    } catch (e) { out.textContent = e.message; }
  });
  box.append(opts, reveal, out);
  return box;
}

async function load() {
  const status = $('status'), list = $('list');
  status.textContent = 'Loading…';
  try {
    const data = await api('/api/questions', {
      exam_id: $('exam').value, subject_id: $('subject').value, year: $('year').value,
      q: $('q').value.trim(), limit: PAGE, offset,
    });
    total = data.total;
    list.replaceChildren(...data.items.map(card));
    render(list);
    status.textContent = total
      ? `Showing ${offset + 1}–${offset + data.items.length} of ${total}`
      : 'No questions match these filters.';
  } catch (e) { status.textContent = e.message; list.replaceChildren(); }
  $('prev').disabled = offset === 0;
  $('next').disabled = offset + PAGE >= total;
  window.scrollTo({ top: 0 });
}
const reset = () => { offset = 0; return load(); };

$('filters').addEventListener('submit', (e) => { e.preventDefault(); reset(); });
$('exam').addEventListener('change', async () => { await loadSubjects(); reset(); });
$('subject').addEventListener('change', async () => { await loadYears(); reset(); });
$('year').addEventListener('change', reset);
$('prev').addEventListener('click', () => { offset = Math.max(0, offset - PAGE); load(); });
$('next').addEventListener('click', () => { offset += PAGE; load(); });

(async () => {
  try {
    const ex = await api('/api/exams');
    fill($('exam'), ex.length ? 'Select exam' : 'No approved questions yet', ex, (e) => `${e.name} (${e.n})`);
    if (ex.length) { $('exam').value = ex[0].id; await loadSubjects(); }
    await load();
  } catch (e) { $('status').textContent = e.message; }
})();
</script>
</body>
</html>
